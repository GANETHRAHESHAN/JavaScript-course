<!DOCTYPE html>
<html>
<head>
  <title>6j</title>
</head>

<body>


  <script>
    const randomNumber = Math.random();
    let result;
    const guess = 'Heads';
    
    if (randomNumber < 0.5) {
        result = 'Heads';
    } else {
        result = 'Tails';
    }

    if (result === guess) {
        console.log('You win!'); 
    } else {
        console.log('You lose!');
    }
  </script>
</body>
</html>
